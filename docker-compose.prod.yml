services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: hvalya-api-prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://hvalya:${RDS_PASSWORD}@${RDS_HOST}:5432/hvalya_prod
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 7d
      AI_SERVICE_URL: http://ai-service:8000
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    ports:
      - "3001:3001"
    volumes:
      - uploads:/app/apps/api/uploads

  ai-service:
    build:
      context: ./apps/ai-service
      dockerfile: Dockerfile
    container_name: hvalya-ai-prod
    restart: unless-stopped
    depends_on:
      - api
    environment:
      ENVIRONMENT: production
      PORT: 8000
      NEST_API_URL: http://api:3001/api/v1
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    ports:
      - "8000:8000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://13.61.26.3:3001/api/v1
    container_name: hvalya-web-prod
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3002:3002"

volumes:
  uploads:
