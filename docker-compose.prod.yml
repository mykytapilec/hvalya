version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: hvalya-pg-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: hvalya
      POSTGRES_PASSWORD: hvalya
      POSTGRES_DB: hvalya_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hvalya -d hvalya_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: hvalya-api-prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://hvalya:hvalya@postgres:5432/hvalya_dev
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 7d
      AI_SERVICE_URL: http://ai-service:8000
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    ports:
      - "3001:3001"
    volumes:
      - uploads:/app/apps/api/uploads

  ai-service:
    build:
      context: .
      dockerfile: apps/ai-service/Dockerfile
    container_name: hvalya-ai-prod
    restart: unless-stopped
    depends_on:
      - api
    environment:
      ENVIRONMENT: production
      PORT: 8000
      NEST_API_URL: http://api:3001/api/v1
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    ports:
      - "8000:8000"

volumes:
  pgdata:
  uploads:
