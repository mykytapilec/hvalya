name: CI

on:
  push:
    branches:
      - 'feature/**'
      - dev
  pull_request:
    branches:
      - dev
      - main

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hvalya
          POSTGRES_PASSWORD: hvalya
          POSTGRES_DB: hvalya_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://hvalya:hvalya@localhost:5432/hvalya_test
      JWT_SECRET: ci_test_secret
      JWT_EXPIRES_IN: 7d
      NODE_ENV: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared packages
        run: npm run build --workspace=packages/types

      - name: Generate Prisma Client
        run: npm run prisma:generate --workspace=apps/api

      - name: Run Prisma migrations
        run: npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma

      - name: Run tests
        run: turbo run test